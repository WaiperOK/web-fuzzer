[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-fuzzer"
version = "0.2.0"
description = "HTTP form fuzzing utility for controlled security testing"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31.0"
]

[project.scripts]
web-fuzzer = "web_fuzzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
